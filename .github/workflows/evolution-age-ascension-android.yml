name: Evolution Age Ascension Android

on:
  push:
    branches:
      - experiment/evolution-age-ascension-android
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Godot project
        shell: bash
        run: |
          mkdir -p build
          base64 --decode experiments/evolution-age-ascension/game.zip.b64 > build/game.zip
          unzip -q build/game.zip -d build
          cat > build/evolution_age_ascension/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../Evolution-Age-Ascension.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="0.1.0"
          package/unique_name="com.ageascension.game"
          package/name="Age Ascension"
          package/signed=true
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=true
          command_line/extra_args=""
          permissions/internet=false
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        shell: bash
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Export Android APK
        id: export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./build/evolution_age_ascension
          export_debug: true
          archive_output: false
          cache: true

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Evolution-Age-Ascension-Android
          path: build/Evolution-Age-Ascension.apk
          if-no-files-found: error
          retention-days: 30
